<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mridanga Bolvanis</title>
<style>
:root{--surface-1:#f5f4ef;--surface-2:#fff;--text-primary:#1a1a18;--text-secondary:#5f5e5a;--border:#d3d1c7;--border-strong:#888780;--radius:8px}
@media (prefers-color-scheme: dark){
:root{--surface-1:#2c2c2a;--surface-2:#1a1a18;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--border:#444441;--border-strong:#888780}
}
body{margin:0;background:var(--surface-2);color:var(--text-primary);font-family:system-ui,sans-serif}
.mb-app{display:flex;min-height:100vh}
.mb-nav{box-sizing:border-box;flex:none;width:250px;height:100vh;position:sticky;top:0;overflow-y:auto;padding:12px 8px;background:var(--surface-1);border-right:1px solid var(--border)}
.mb-nav button{display:block;width:100%;border:0;border-radius:var(--radius);padding:10px 12px;background:transparent;color:var(--text-primary);cursor:pointer;font:inherit;font-size:15px;line-height:1.35;text-align:left}
.mb-nav button[aria-current=true]{background:var(--surface-2);font-weight:500}
.mb-nav h2{margin:16px 12px 4px;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary)}
.mb-nav h2:first-child{margin-top:4px}
.mb-shade{display:none}
.mb{box-sizing:border-box;flex:1;min-width:0;max-width:584px;margin:0 auto;padding:12px}
.mb-top button,.mb-ctl button{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius);padding:0 10px;min-width:42px;min-height:42px;color:var(--text-primary);cursor:pointer;font:inherit;font-size:16px}
.mb-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mb-top h1{margin:0;font-size:17px;font-weight:500;line-height:1.3}
#mb-menu{display:none}
/* Phone, upright or on its side: the list becomes a drawer that slides in from the left */
@media (max-width:760px),(max-height:500px){
#mb-menu{display:block}
.mb-nav{position:fixed;left:0;z-index:2;width:min(82vw,300px);visibility:hidden;transform:translateX(-100%);transition:transform .2s,visibility .2s}
.nav-open .mb-nav{visibility:visible;transform:none}
.nav-open .mb-shade{display:block;position:fixed;inset:0;z-index:1;background:rgba(0,0,0,.4)}
}
.mb-chips{display:flex;flex-wrap:wrap;gap:6px 8px}
.mb-word{display:flex;gap:3px}
.mb-br{flex-basis:100%}
.mb-leg{flex-basis:100%;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)}
.mb-leg svg{width:12px;height:12px}
.mb-leg svg+svg{margin-left:8px}
.mb-chip{box-sizing:border-box;width:54px;border:1px solid var(--border);border-radius:var(--radius);padding:5px 1px;background:none;cursor:pointer;font:inherit;text-align:center;line-height:1.3;scroll-margin-top:8px}
.mb-chip b{display:block;margin-bottom:3px;font-size:15px;font-weight:500;color:var(--text-primary)}
.mb-chip svg{width:24px;height:28px;vertical-align:top}
.mb-chip rect{fill:var(--border)}
.mb-chip .kl{transform:scaleX(-1)}
/* Striking parts: closed is solid orange, open is a green outline */
.mb-chips .kc{fill:#D85A30}
.mb-chips .ko{fill:none;stroke:#1D9E75;stroke-width:1.5}
.mb-chip.on{background:var(--surface-1);border-color:var(--text-primary);box-shadow:0 0 0 1px var(--text-primary)}
/* Hands and controls stay pinned to the bottom while a long bolvani scrolls above them */
.mb-stage{position:sticky;bottom:0;background:var(--surface-2);margin:0 -12px;padding:0 12px 8px}
/* Phone on its side: strokes on the left, hands pinned on the right and sized to fit the screen height */
@media (max-height:500px){
.mb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,45%);grid-template-rows:auto 1fr;column-gap:16px;align-items:start;max-width:none}
.mb-stage{grid-column:2;grid-row:1/3;top:0;bottom:auto;margin:0;padding:0}
.mb-stage>svg{max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px)}
}
.mb-stage>svg{display:block;margin-top:4px}
.mb-head{fill:var(--surface-1);stroke:var(--border-strong);stroke-width:1.5}
.mb-gab{fill:var(--text-secondary);opacity:.3}
.mb-h rect{fill:var(--surface-2);stroke:var(--text-secondary);stroke-width:1.5}
.mb-h[data-p=fingers] .kf,.mb-h[data-p=three] .k3,.mb-h[data-p=one] .k1,.mb-h[data-p=thumb] .kt,.mb-h[data-p=hand] rect{fill:color-mix(in srgb,var(--kf) var(--ka),var(--surface-2));stroke:color-mix(in srgb,var(--ks) var(--ka),var(--text-secondary))}
.mb-ctl{margin-top:8px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary)}
.mb-ctl input{flex:1;min-width:0}
.mb-ctl svg{display:block;width:20px;height:20px;fill:currentColor}
.mb-step{display:flex;gap:4px}
.mb-ctl button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>

<div class="mb-app">
<nav class="mb-nav" id="mb-nav" aria-label="Bolvanis"></nav>
<div class="mb-shade" id="mb-shade"></div>
<main class="mb">
<div class="mb-top">
<button id="mb-menu" aria-label="Bolvani list" aria-expanded="false">&#9776;</button>
<h1 id="mb-title"></h1>
</div>
<div class="mb-chips" id="mb-chips"></div>
<div class="mb-stage">
<svg width="100%" viewBox="60 25 495 300" role="img" aria-label="Hands striking the two heads of a mridanga">
<circle class="mb-head" cx="190" cy="150" r="85"/>
<circle class="mb-gab" cx="190" cy="150" r="42"/>
<circle id="mb-tL" cx="190" cy="150" r="85" fill="#D85A30" opacity="0"/>
<circle id="mb-rL" cx="190" cy="150" r="85" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0"/>
<circle class="mb-head" cx="430" cy="150" r="48"/>
<circle class="mb-gab" cx="430" cy="150" r="24"/>
<circle id="mb-tR" cx="430" cy="150" r="48" fill="#D85A30" opacity="0"/>
<circle id="mb-rR" cx="430" cy="150" r="48" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0"/>
<g id="mb-hL" class="mb-h" transform="translate(190,145) scale(-0.85,0.85)">
<rect class="kf" x="-38" y="-62" width="17" height="74" rx="8.5"/>
<rect class="kf" x="-18.3" y="-70" width="17" height="82" rx="8.5"/>
<rect class="kf" x="1.3" y="-64" width="17" height="76" rx="8.5"/>
<rect class="kf" x="21" y="-48" width="17" height="60" rx="8.5"/>
<rect class="kt" x="-10" y="-58" width="20" height="66" rx="10" transform="translate(-34,50) rotate(-42)"/>
<rect x="-38" y="0" width="76" height="82" rx="20"/>
</g>
<g id="mb-hR" class="mb-h" transform="translate(430,177) scale(0.85)">
<rect class="kf k1" x="-38" y="-62" width="17" height="74" rx="8.5"/>
<rect class="kf k3" x="-18.3" y="-70" width="17" height="82" rx="8.5"/>
<rect class="kf k3" x="1.3" y="-64" width="17" height="76" rx="8.5"/>
<rect class="kf k3" x="21" y="-48" width="17" height="60" rx="8.5"/>
<rect class="kt" x="-10" y="-58" width="20" height="66" rx="10" transform="translate(-34,50) rotate(-42)"/>
<rect x="-38" y="0" width="76" height="82" rx="20"/>
</g>
</svg>
<div class="mb-ctl">
<div class="mb-step">
<button id="mb-prev" aria-label="Previous stroke"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
<button id="mb-btn"></button>
<button id="mb-next" aria-label="Next stroke"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div>
<span>Slow</span>
<input type="range" id="mb-sp" min="0" max="100" value="23" aria-label="Speed">
<span>Fast</span>
</div>
</div>
</main>
</div>

<script>
(function(){
const S=0.85,el=function(i){return document.getElementById(i)};
// Hand positions: F = fingers on right head, T = thumb on right head, N = index finger on right head, K = left hand flat on left head,
// G = left fingers on the lower part of the left head with the palm off the drum (open stroke)
const F={x:430,y:177,r:0},T={x:489,y:156,r:20},N={x:455,y:190,r:0},K={x:190,y:145,r:0},G={x:190,y:215,r:0};
const HAND={L:'Left',R:'Right'},PART={fingers:'4 fingers',three:'3 fingers',one:'1 finger',thumb:'thumb',hand:'hand'};
function hit(hand,part,open,pose){return{hand:hand,part:part,open:open,pose:pose}}
const TE=hit('R','fingers',false,F),RE=hit('R','thumb',false,T),TA=hit('R','fingers',true,F),
T3=hit('R','three',false,F),N1=hit('R','one',true,N),
KHE=hit('L','hand',false,K),GHE=hit('L','fingers',true,G);
// Syllables: name shown, then the hits. Two hits = both hands together (left hit first). No hits = a wait.
const SYL={
te:['Te',TE],re:['Re',RE],khe:['Khe',KHE],ta:['Ta',TA],
kho:['Kho',KHE],
ghe:['Ghe',GHE],ghi:['Ghi',GHE],ga:['Ga',GHE],na:['Na',N1],
de:['De',GHE,TE],dhi:['Dhi',GHE,T3],
jha:['Jha',GHE,N1],da:['Da',GHE,N1],
takhe:['Ta',KHE,TA],
// From class 14 on: Te = 3 fingers, Re = index finger, Ta = 3 fingers open
te3:['Te',T3],re1:['Re',hit('R','one',false,N)],ta3:['Ta',hit('R','three',true,F)],
// The second Te of kaharwa (Da ghi te te) adds the left hand
te1:['Te',KHE,hit('R','one',false,N)],
_:['–']};
// Pench pieces are played twice: starting on Jha, then the same starting on Ta (right open + left closed).
function jt(p){return p+' / '+p.replace(/jha/g,'takhe')}
// One syllable per beat. Hyphens join syllables into a word, "/" starts a new line, "_" is a wait.
// [name in the list, strokes]; an entry with only a name is a heading. Add a line here for a new one.
const BOLS=[
['Bolvanis'],
['1. Te re khe ta','te-re khe-ta'],
['2. Tere tere kheta','te-re te-re khe-ta'],
['3. Tere kheta, tere tere kheta','te-re khe-ta / te-re te-re khe-ta'],
['4. Tere tere tere kheta','te-re te-re te-re khe-ta'],
['5. Tere tere kheta, tere kheta tere kheta','te-re te-re khe-ta / te-re khe-ta te-re khe-ta'],
['6. Tere tere kheta takho','te-re te-re khe-ta ta-kho'],
['7. Takho takho tere kheta','ta-kho ta-kho te-re khe-ta'],
['8. Takho tere kheta ×2, tere kheta','ta-kho te-re khe-ta / ta-kho te-re khe-ta / te-re khe-ta'],
['9. Ghe te te','ghe te te'],
['10. Kheta takho tere kheta','khe-ta ta-kho te-re khe-ta'],
['11. Tere tere kheta, takho tere kheta','te-re te-re khe-ta / ta-kho te-re khe-ta'],
['12. Takho takho takho, takho tere kheta','ta-kho ta-kho ta-kho / ta-kho te-re khe-ta'],
['13. De re ghe na','de-re ghe-na'],
['14. Tere ghena, dere ghena ×2, tere kheta','te-re ghe-na / de-re ghe-na / de-re ghe-na / te-re khe-ta'],
['Pench'],
['Class 9 · Jha – tere tere kheta, takho tere kheta',jt('jha _ te-re te-re khe-ta / ta-kho te-re khe-ta')],
['Class 10 · adds takho takho tere kheta ×2',jt('jha _ te-re te-re khe-ta / ta-kho te-re khe-ta / ta-kho ta-kho te-re khe-ta / ta-kho ta-kho te-re khe-ta')],
['Class 11 · adds tere kheta, tere tere kheta, takho tere kheta',jt('jha _ te-re te-re khe-ta / ta-kho te-re khe-ta / te-re khe-ta / te-re te-re khe-ta / ta-kho te-re khe-ta')],
['Class 12 · Jha jha jha jha, tere kheta tere kheta',jt('jha jha jha jha / te-re khe-ta te-re khe-ta')],
['Class 12 · Jha tere kheta ×2, tere kheta',jt('jha te-re khe-ta / jha te-re khe-ta / te-re khe-ta')],
['Class 13 · Jha takho tere kheta',jt('jha ta-kho te-re khe-ta / ta-kho ta-kho / te-re khe-ta / ta-kho te-re khe-ta / ta-kho te-re khe-ta / te-re khe-ta')],
['Class 13 · Jha jha jha jha, tere tere tere tere',jt('jha jha jha jha / te-re te-re te-re te-re / khe-ta ta-kho te-re khe-ta / te-re khe-ta te-re khe-ta')],
['Kaharwa'],
['Class 14 · Da ghi te te, na ga dhi na','da ghi te3 te1 / na ga dhi na'],
['Class 16 · Tere kheta jha ×2, tere kheta','te3-re1 khe-ta3 jha / te3-re1 khe-ta3 jha / te3-re1 khe-ta3'],
['Class 16 · Da ghi tere kheta, na ga dhi na','da ghi te3-re1 khe-ta3 / na ga dhi na']];
const bols=BOLS.filter(function(b){return b[1]});
// step = the one stroke being repeated, or -1 when the whole bolvani runs
let strokes=[],L=4,ph=-0.3,chips=[],shown=-2,step=-1;
// Closed: press and hold 0.3 beat, then lift slowly over 0.4 beat. Open: snap back in 0.12 beat.
// ponytail: assumes one syllable per beat, so same-hand strokes are at least one beat apart; rework the lift timing for half-beat strokes
function keys(h){
const ss=strokes.filter(function(s){return s.hand===h}),kf=[];
if(!ss.length)return null;
ss.forEach(function(s,i){
const n=ss[(i+1)%ss.length],tn=n.t+(i+1<ss.length?0:L);
kf.push({t:s.t,lift:0,s:s,e:'in'});
if(s.open)kf.push({t:s.t+0.12,lift:1,s:s,e:'out'});
else kf.push({t:s.t+0.3,lift:0,s:s},{t:s.t+0.7,lift:1,s:s});
kf.push({t:tn-0.3,lift:1,s:s});
});
kf.push({t:ss[0].t+L,lift:0,s:ss[0],e:'in'});
return kf;
}
function at(h,t){
const kf=h.kf;
if(!kf)return{lift:1,x:h.rest.x,y:h.rest.y,r:0,s:null};
let tt=t<kf[0].t?t+L:t,i=0;
while(tt>=kf[i+1].t)i++;
const a=kf[i],b=kf[i+1],p=(tt-a.t)/(b.t-a.t);
const e=b.e==='in'?p*p:b.e==='out'?1-(1-p)*(1-p):p;
const m=p*p*(3-2*p),A=a.s.pose,B=b.s.pose;
return{lift:a.lift+(b.lift-a.lift)*e,x:A.x+(B.x-A.x)*m,y:A.y+(B.y-A.y)*m,r:A.r+(B.r-A.r)*m,s:b.s};
}
const hands={
L:{g:el('mb-hL'),tint:el('mb-tL'),ring:el('mb-rL'),R0:85,m:-1,rest:K},
R:{g:el('mb-hR'),tint:el('mb-tR'),ring:el('mb-rR'),R0:48,m:1,rest:F}};
const chipBox=el('mb-chips'),nav=el('mb-nav'),menu=el('mb-menu');
const stage=document.querySelector('.mb-stage');
// Where a stroke box sits on screen: [top, bottom, lowest visible point].
function span(c){
const r=c.getBoundingClientRect(),s=stage.getBoundingClientRect();
// Upright, the pinned hands cover the bottom of the screen; with the phone on its side they sit beside the strokes.
return[r.top,r.bottom,s.left>r.left?innerHeight:Math.min(innerHeight,s.top)];
}
// Follow the playing stroke a page at a time: when its row runs off, that row jumps to the top.
function follow(i,prev){
if(!chips[i])return;
const c=span(chips[i]),p=chips[prev]&&span(chips[prev]);
// Leave the page alone if the stroke is readable, or if the reader had scrolled away from the one before it.
if(c[1]>0&&c[1]<=c[2]||p&&(p[1]<=0||p[0]>=p[2]))return;
if(i)chips[i].scrollIntoView();else scrollTo(0,0);
}
function draw(ph){
Object.keys(hands).forEach(function(k){
const h=hands[k],v=at(h,ph),sc=S*(1+0.22*v.lift),col=v.s&&v.s.open?['#1D9E75','#0F6E56']:['#D85A30','#993C1D'];
h.g.setAttribute('transform','translate('+v.x+','+v.y+') rotate('+v.r+') scale('+(h.m*sc)+','+sc+')');
h.g.setAttribute('opacity',1-0.5*v.lift);
h.g.dataset.p=v.s?v.s.part:'';
h.g.style.setProperty('--kf',col[0]);
h.g.style.setProperty('--ks',col[1]);
// Colour is full on the drum and fades back to white as the hand lifts
let ka=1-Math.pow(v.lift,3);
h.tint.setAttribute('fill',col[0]);
h.tint.setAttribute('opacity',0.3*Math.pow(1-v.lift,4));
let ro=0,rr=h.R0;
if(ph>=0)strokes.forEach(function(s){
if(s.hand===k&&s.open&&(step<0||s.t===step)){const d=((ph-s.t)%L+L)%L;if(d<0.9){ro=1-d/0.9;rr=h.R0+36*d/0.9;}
// An open hand leaves at once, but its colour lasts as long as a closed stroke's: full for 0.3 beat, gone by 0.7
if(d<0.7)ka=Math.max(ka,d<0.3?1:1-Math.pow((d-0.3)/0.4,3));}
});
h.g.style.setProperty('--ka',100*ka+'%');
h.ring.setAttribute('r',rr);
h.ring.setAttribute('opacity',ro);
});
const i=step>=0?step:Math.floor(ph);
if(i===shown)return;
const prev=shown;
shown=i;
chips.forEach(function(c,j){c.classList.toggle('on',j===i)});
follow(i,prev);
}
// Small picture of one hand for a stroke box: the parts that strike are coloured, like the big hands below
function mini(left,x){
const p=x?x.part:'',on=x&&x.open?'ko':'kc';
function r(lit,a){return '<rect'+(lit?' class="'+on+'"':'')+' '+a+' rx="2"/>'}
return '<svg viewBox="-1 -1 27 31"'+(left?' class="kl"':'')+' aria-hidden="true">'+
[11,13,12,9].map(function(h,i){return r(p==='fingers'||p==='hand'||p==='three'&&i>0||p==='one'&&!i,'x="'+(6+5*i)+'" y="'+(13-h)+'" width="4" height="'+h+'"')}).join('')+
r(p==='hand','x="6" y="14.5" width="19" height="14"')+r(p==='thumb'||p==='hand','x="0" y="15" width="4" height="10"')+'</svg>';
}
const LEG='<div class="mb-leg"><svg viewBox="0 0 12 12" aria-hidden="true"><rect class="kc" width="12" height="12" rx="3"/></svg>closed<svg viewBox="0 0 12 12" aria-hidden="true"><rect class="ko" x="1" y="1" width="10" height="10" rx="3"/></svg>open</div>';
function openNav(on){document.body.classList.toggle('nav-open',on);menu.setAttribute('aria-expanded',on);}
nav.innerHTML=BOLS.map(function(b){return b[1]?'<button>'+b[0]+'</button>':'<h2>'+b[0]+'</h2>'}).join('');
const navBtns=Array.from(nav.querySelectorAll('button'));
function setBol(i){
navBtns.forEach(function(b,j){b.setAttribute('aria-current',j===i)});
el('mb-title').textContent=navBtns[i].textContent;
openNav(false);
strokes=[];L=0;
chipBox.innerHTML=LEG+bols[i][1].split(' ').map(function(w){
if(w==='/')return '<div class="mb-br"></div>';
return '<div class="mb-word">'+w.split('-').map(function(k){
const s=SYL[k];
console.assert(s,'unknown syllable '+k);
const hits=s.slice(1),t=L++;
hits.forEach(function(x){strokes.push(Object.assign({t:t},x))});
function h(d){return hits.find(function(x){return x.hand===d})}
// The words stay as a tooltip; the box itself shows the two hands
return '<button class="mb-chip" title="'+(hits.map(function(x){return HAND[x.hand]+' '+PART[x.part]+' '+(x.open?'open':'closed')}).join(' + ')||'wait')+'"><b>'+s[0]+'</b>'+(hits.length?mini(true,h('L'))+mini(false,h('R')):'')+'</button>';
}).join('')+'</div>';
}).join('');
ph=-0.3;shown=-2;step=-1;
hands.L.kf=keys('L');hands.R.kf=keys('R');
chips=Array.from(chipBox.querySelectorAll('.mb-chip'));
scrollTo(0,0);
draw(ph);
}
navBtns.forEach(function(b,j){b.onclick=function(){playing=!calm;sync();setBol(j)}});
menu.onclick=function(){openNav(!document.body.classList.contains('nav-open'))};
el('mb-shade').onclick=function(){openNav(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape')openNav(false)});
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=0,playing=!calm;
const btn=el('mb-btn'),sp=el('mb-sp');
const ICON={Play:'M8 5v14l11-7z',Pause:'M6 5h4v14H6zM14 5h4v14h-4z'};
function sync(){
const n=playing?'Pause':'Play';
btn.setAttribute('aria-label',n);
// Stepping is for when the bolvani is not running
el('mb-prev').disabled=el('mb-next').disabled=playing;
btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICON[n]+'"/></svg>';
}
// Pause does not freeze: it keeps repeating the stroke it stopped on
btn.onclick=function(){if(playing&&step<0)step=Math.max(0,Math.floor(ph));playing=!playing;sync();};
// Picking one stroke repeats just that stroke; Play then carries on from it.
function select(i){step=(i+L)%L;playing=false;ph=step-0.3;sync();draw(ph);}
function cur(){return step>=0?step:Math.floor(ph)}
el('mb-prev').onclick=function(){select(Math.max(cur(),0)-1)};
el('mb-next').onclick=function(){select(cur()+1)};
chipBox.onclick=function(e){const c=e.target.closest('.mb-chip');if(c)select(chips.indexOf(c))};
document.addEventListener('keydown',function(e){
if(e.target===sp)return;
if(e.key==='ArrowLeft')el('mb-prev').click();
if(e.key==='ArrowRight')el('mb-next').click();
});
function frame(now){
if(playing||step>=0){
// Slider 0..100 maps to 30..600 strokes per minute on a log scale, so the slow end keeps fine control.
ph+=Math.min(now-last,100)/(60000/(30*Math.pow(20,sp.value/100)));
// One stroke repeats from its approach (0.3 beat before) to the end of its lift (0.7 after).
// After Play it runs on, and the stroke stays marked until the hand lands.
if(step<0){if(ph>=L)ph-=L}
else if(!playing){if(ph>=step+0.7)ph-=1}
else if(ph>=step)step=-1;
draw(ph);
}
last=now;requestAnimationFrame(frame);
}
sync();setBol(0);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
